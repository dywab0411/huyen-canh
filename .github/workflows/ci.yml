name: Local checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run check:secrets
      - name: Start safe local API for browser regression
        run: |
          npm run worker:preview -- --ip 127.0.0.1 --port 8788 > worker-ci.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail http://127.0.0.1:8788/api/config; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
      - run: npm run test:worker
      - run: npm run build:public-preview
      - run: npm run check:deploy
      - run: npm run verify:public-preview -- http://127.0.0.1:8788 docs/deploy-free/public-ci
